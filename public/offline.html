<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07070a">
  <title>Sem conexão · AFIM Publicidade</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe4;
      background: radial-gradient(900px 500px at 80% -10%, rgba(217,171,49,.14), transparent 60%), #07070a; }
    main { max-width: 22rem; }
    .logo { font-size: 3.2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1;
      background: linear-gradient(135deg,#f6dc8c,#d9ab31 55%,#9a7416); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin: .3rem 0 2rem; font-size: .6rem; letter-spacing: .5em; color: #b9b2a2; }
    h1 { font-size: 1.25rem; margin: 0 0 .6rem; }
    p { margin: 0 0 1.6rem; color: #b9b2a2; line-height: 1.5; font-size: .95rem; }
    button { min-height: 2.9rem; padding: .5rem 1.6rem; border: 0; border-radius: .8rem; cursor: pointer; font-weight: 700; font-size: 1rem;
      color: #15110a; background: linear-gradient(135deg,#f6dc8c,#d9ab31 52%,#b98a1c); }
  </style>
</head>
<body>
  <main>
    <div class="logo">AFIM</div>
    <div class="sub">PUBLICIDADE</div>
    <h1>Sem conexão com a internet</h1>
    <p>Por segurança, os dados financeiros e de clientes só aparecem com internet. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
